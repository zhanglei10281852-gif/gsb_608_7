name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test

      - name: Build library
        run: npm run build:lib

      - name: Build docs
        run: npm run docs:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexa-ui-dist
          path: |
            dist
            docs/.vitepress/dist
